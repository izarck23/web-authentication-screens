<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Authentication Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <main class="auth-app" aria-label="Authentication app">
    <section class="mobile-shell">
      <!-- Welcome Screen -->
      <section class="screen screen-welcome is-active" id="welcomeScreen" aria-labelledby="welcomeTitle">
        <div class="welcome-content reveal r1">
          <h1 id="welcomeTitle">Welcome Back!</h1>
          <p>Enter details to the account</p>
        </div>

        <div class="welcome-actions reveal r2">
          <button type="button" class="welcome-btn welcome-btn--ghost" id="toSigninBtn">Sign in</button>
          <button type="button" class="welcome-btn welcome-btn--solid" id="toSignupBtn">Sign up</button>
        </div>
      </section>

      <!-- Sign Up Screen -->
      <section class="screen screen-form" id="signupScreen" aria-labelledby="signupTitle">
        <div class="top-visual">
          <button type="button" class="back-button" data-back="welcomeScreen" aria-label="Back">
            <span aria-hidden="true">‹</span> Back
          </button>
        </div>

        <div class="form-sheet">
          <h2 id="signupTitle" class="form-title">Get Started</h2>

          <form id="signupForm" class="auth-form" novalidate>
            <div class="form-group">
              <label for="signupName">Full Name</label>
              <input id="signupName" name="name" type="text" autocomplete="name" required />
            </div>

            <div class="form-group">
              <label for="signupEmail">Email</label>
              <input id="signupEmail" name="email" type="email" autocomplete="email" required />
            </div>

            <div class="form-group">
              <label for="signupPassword">Password</label>
              <input id="signupPassword" name="password" type="password" autocomplete="new-password" required />
            </div>

            <label class="checkbox-wrap">
              <input id="terms" type="checkbox" required />
              <span>I agree to the processing of <strong>data</strong></span>
            </label>

            <p class="form-message" id="signupMessage" aria-live="polite"></p>

            <button type="submit" class="primary-button" id="signupSubmit">Sign up</button>
          </form>

          <p class="separator">Sign up with</p>

          <div class="social-auth" aria-label="Social sign up options">
            <button type="button" class="social-btn social-facebook" aria-label="Facebook">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M13.5 22v-8h2.7l.4-3h-3.1V9.1c0-.9.3-1.6 1.7-1.6H16.7V4.8c-.3 0-1.3-.1-2.5-.1-2.4 0-4 1.5-4 4.2V11H7.5v3h2.7v8h3.3Z"/></svg>
            </button>
            <button type="button" class="social-btn social-twitter" aria-label="Twitter">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M22 5.9c-.7.3-1.5.5-2.2.6.8-.5 1.4-1.2 1.7-2.1-.8.5-1.7.8-2.6 1-1.5-1.6-4.2-1.6-5.7 0-1 1-1.4 2.4-1.1 3.7-3.2-.2-6.2-1.8-8.2-4.3-1 1.8-.5 4 1.1 5.1-.6 0-1.2-.2-1.8-.5 0 2 1.4 3.8 3.4 4.2-.6.2-1.2.2-1.8.1.6 1.8 2.3 3.1 4.2 3.1A8.6 8.6 0 0 1 2 19.5 12.1 12.1 0 0 0 8.6 21c8 0 12.6-6.9 12.3-13 .8-.5 1.5-1.2 2.1-2.1Z"/></svg>
            </button>
            <button type="button" class="social-btn social-google" aria-label="Google">
              <svg viewBox="0 0 24 24" width="16" height="16">
                <path fill="#4285F4" d="M21.8 12.2c0-.8-.1-1.4-.2-2.1H12v4h5.5c-.1 1-.8 2.5-2.3 3.5l-.1.3 3.3 2.5.2.1c2-1.8 3.2-4.5 3.2-8.3Z"/>
                <path fill="#34A853" d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.3-2.6c-.9.6-2.1 1-3.6 1-2.7 0-4.9-1.8-5.7-4.2l-.3.1-3.4 2.6-.1.3A10.4 10.4 0 0 0 12 22Z"/>
                <path fill="#FBBC05" d="M6.3 13.7A6.2 6.2 0 0 1 6 12c0-.6.1-1.2.3-1.7l-.1-.3-3.4-2.7-.1.1A10 10 0 0 0 2 12c0 1.7.4 3.4 1.2 4.8l3.1-2.4Z"/>
                <path fill="#EA4335" d="M12 6.1c1.9 0 3.2.8 3.9 1.5l2.9-2.8C17.2 3.3 14.8 2 12 2 8 2 4.5 4.3 2.8 7.7l3.6 2.8c.8-2.4 3-4.4 5.6-4.4Z"/>
              </svg>
            </button>
            <button type="button" class="social-btn social-apple" aria-label="Apple">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16.7 12.9c0-2.3 1.9-3.4 2-3.4-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.9c-1.6 0-3 .9-3.8 2.3-1.6 2.8-.4 6.9 1.1 9.1.7 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.2.8-1.2 1.2-2.4 1.2-2.5 0 0-2.3-.9-2.3-3.7ZM14.4 6.3c.6-.8 1-1.9.9-3-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.8-.9 2.9 1 0 2-.5 2.7-1.3Z"/></svg>
            </button>
          </div>

          <p class="bottom-switch">
            Already have an account?
            <button type="button" class="text-link" data-open="signinScreen">Sign in</button>
          </p>
        </div>
      </section>

      <!-- Sign In Screen -->
      <section class="screen screen-form" id="signinScreen" aria-labelledby="signinTitle">
        <div class="top-visual">
          <button type="button" class="back-button" data-back="welcomeScreen" aria-label="Back">
            <span aria-hidden="true">‹</span> Back
          </button>
        </div>

        <div class="form-sheet">
          <h2 id="signinTitle" class="form-title">Welcome back</h2>

          <form id="signinForm" class="auth-form" novalidate>
            <div class="form-group">
              <label for="signinEmail">Email</label>
              <input id="signinEmail" name="email" type="email" autocomplete="email" required />
            </div>

            <div class="form-group">
              <label for="signinPassword">Password</label>
              <input id="signinPassword" name="password" type="password" autocomplete="current-password" required />
            </div>

            <div class="form-row">
              <label class="checkbox-wrap checkbox-wrap--small">
                <input id="rememberMe" type="checkbox" />
                <span>Remember me</span>
              </label>

              <button type="button" class="text-link forgot-link" id="forgotPasswordBtn">Forgot password?</button>
            </div>

            <p class="form-message" id="signinMessage" aria-live="polite"></p>

            <button type="submit" class="primary-button" id="signinSubmit">Sign in</button>
          </form>

          <p class="separator">Sign in with</p>

          <div class="social-auth" aria-label="Social sign in options">
            <button type="button" class="social-btn social-facebook" aria-label="Facebook">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M13.5 22v-8h2.7l.4-3h-3.1V9.1c0-.9.3-1.6 1.7-1.6H16.7V4.8c-.3 0-1.3-.1-2.5-.1-2.4 0-4 1.5-4 4.2V11H7.5v3h2.7v8h3.3Z"/></svg>
            </button>
            <button type="button" class="social-btn social-twitter" aria-label="Twitter">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M22 5.9c-.7.3-1.5.5-2.2.6.8-.5 1.4-1.2 1.7-2.1-.8.5-1.7.8-2.6 1-1.5-1.6-4.2-1.6-5.7 0-1 1-1.4 2.4-1.1 3.7-3.2-.2-6.2-1.8-8.2-4.3-1 1.8-.5 4 1.1 5.1-.6 0-1.2-.2-1.8-.5 0 2 1.4 3.8 3.4 4.2-.6.2-1.2.2-1.8.1.6 1.8 2.3 3.1 4.2 3.1A8.6 8.6 0 0 1 2 19.5 12.1 12.1 0 0 0 8.6 21c8 0 12.6-6.9 12.3-13 .8-.5 1.5-1.2 2.1-2.1Z"/></svg>
            </button>
            <button type="button" class="social-btn social-google" aria-label="Google">
              <svg viewBox="0 0 24 24" width="16" height="16">
                <path fill="#4285F4" d="M21.8 12.2c0-.8-.1-1.4-.2-2.1H12v4h5.5c-.1 1-.8 2.5-2.3 3.5l-.1.3 3.3 2.5.2.1c2-1.8 3.2-4.5 3.2-8.3Z"/>
                <path fill="#34A853" d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.3-2.6c-.9.6-2.1 1-3.6 1-2.7 0-4.9-1.8-5.7-4.2l-.3.1-3.4 2.6-.1.3A10.4 10.4 0 0 0 12 22Z"/>
                <path fill="#FBBC05" d="M6.3 13.7A6.2 6.2 0 0 1 6 12c0-.6.1-1.2.3-1.7l-.1-.3-3.4-2.7-.1.1A10 10 0 0 0 2 12c0 1.7.4 3.4 1.2 4.8l3.1-2.4Z"/>
                <path fill="#EA4335" d="M12 6.1c1.9 0 3.2.8 3.9 1.5l2.9-2.8C17.2 3.3 14.8 2 12 2 8 2 4.5 4.3 2.8 7.7l3.6 2.8c.8-2.4 3-4.4 5.6-4.4Z"/>
              </svg>
            </button>
            <button type="button" class="social-btn social-apple" aria-label="Apple">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16.7 12.9c0-2.3 1.9-3.4 2-3.4-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.9c-1.6 0-3 .9-3.8 2.3-1.6 2.8-.4 6.9 1.1 9.1.7 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.2.8-1.2 1.2-2.4 1.2-2.5 0 0-2.3-.9-2.3-3.7ZM14.4 6.3c.6-.8 1-1.9.9-3-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.8-.9 2.9 1 0 2-.5 2.7-1.3Z"/></svg>
            </button>
          </div>

          <p class="bottom-switch">
            Don't have an account?
            <button type="button" class="text-link" data-open="signupScreen">Sign up</button>
          </p>
        </div>
      </section>
    </section>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
